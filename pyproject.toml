[project]
name = "card-to-ledger-ar"
version = "0.1.0"
description = "Independent prototype: month end close in ARS for an Argentine company spending in USD and USDC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "anthropic>=0.60",
]

[project.scripts]
ctl = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
